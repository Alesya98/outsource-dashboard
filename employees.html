<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./img/favoconic.png" type="image/x-icon">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="layout">
    <header class="header">
        <aside class="sidebar">
        <button class="burger-menu">
            <img src="img/menu.png" alt="burger-menu">
        </button>
            <div class="period-box">
                <label for="month-select" class="sidebar__title">Period</label>
                <select id="month-select" class="sidebar-select">
                    <option value="january">January</option>
                    <option value="february">February</option>
                    <option value="march">March</option>
                    <option value="april" selected>April</option>
                    <option value="may">May</option>
                    <option value="june">June</option>
                    <option value="july">July</option>
                    <option value="august">August</option>
                    <option value="september">September</option>
                    <option value="october">October</option>
                    <option value="november">November</option>
                    <option value="december">December</option>
                </select>

                <select id="year-select" class="sidebar-select">
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                </select>
            </div>

            <nav class="nav-menu">
                <a href="index.html">Projects</a>
                <a class="active-empl" href="employees.html">Employees</a>
            </nav>
        </aside>
    </header>

    <main class="main">
         <form class="form-hidden">
            <h2 class="form-title">Add New Employee</h2>
            <div class="form-input">
                <label for="name">Name: *</label>
                <input type="text" id="name" required>
                <span class="error-msg"></span>
            </div>
            <div class="form-input">
                <label for="surname">Surname: *</label>
                <input type="text" id="surname" required>
                <span class="error-msg"></span>
            </div>
            <div class="form-input">
                <label for="birth">Date of Birth: *</label>
                <input type="date" id="birth" required>
                <span class="error-msg"></span>
            </div>
            <div class="form-input">
                <label for="position">Position: *</label>
                <select  id="position" required>
                    <option value="" selected>Select position</option>
                    <option value="junior">Junior</option>
                    <option value="middle">Middle</option>
                    <option value="senior">Senior</option>
                    <option value="lead">Lead</option>
                    <option value="architect">Architect</option>
                    <option value="bo">BO</option>
                </select>
                <span class="error-msg"></span>
            </div>

              <div class="form-input">
                <label for="salary">Salary *</label>
                <input type="number" id="salary" required>
                <span class="error-msg"></span>
            </div>

            <div class="form-btn">
                <button type="submit" class="form-add disabled ">Add</button>
                <button class="form-cancel">Cancel</button>
            </div>
        </form>
        <section class="project-container">
            <h1 class="project__title">Employees</h1>
                <button class="btn btn__add">+Add Employee</button>
        </section>
        <section class="table-container">
            <table class="table">
                <thead class="table-header">
                    <tr>
                        <th>Name</th>
                        <th>Surname</th>
                        <th>Age</th>
                        <th>Position</th>
                        <th>Salary</th>
                        <th>Estimated Payment</th>
                        <th>Project</th>
                        <th>Projected Income</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody class="table-body">
                    <tr>

                    </tr>
                </tbody>
            </table>
            

        </section>
    </main>
    </div>
    <script src="./employees.js" type="module"></script>
</body>

</html>
