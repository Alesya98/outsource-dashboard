<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./img/favoconic.png" type="image/x-icon">
    <title>Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
    <header class="header">
        <aside class="sidebar">
            <button class="burger-menu">
                <img class="burger-menu-img" src="img/menu.png" alt="burger-menu">
            </button>
            <div class="period-box">
                <label for="month-select" class="sidebar__title">Period</label>
                <select id="month-select" class="sidebar-select">
                    <option value="january">January</option>
                    <option value="february">February</option>
                    <option value="march">March</option>
                    <option value="april" selected>April</option>
                    <option value="may" >May</option>
                    <option value="june">June</option>
                    <option value="july">July</option>
                    <option value="august">August</option>
                    <option value="september">September</option>
                    <option value="october">October</option>
                    <option value="november">November</option>
                    <option value="december">December</option>
                </select>

                <select id="year-select" class="sidebar-select">
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                </select>
            </div>

            <nav class="nav-menu">
                <a class="active-project" href="index.html">Projects</a>
                <a href="employees.html">Employees</a>
            </nav>
        </aside>
    </header>

    <main class="main"> 
        <form class="form-hidden">
            <h2 class="form-title">Add New Project</h2>
            <div class="form-input">
                <label for="name">Project Name: *</label>
                <input type="text" id="name" required>
                <span class="error-msg"></span>
            </div>
            <div class="form-input">
                <label for="company">Company Name: *</label>
                <input type="text" id="company" minlength="2" required>
                <span class="error-msg"></span>
            </div>
            <div class="form-input">
                <label for="budget">Budget: *</label>
                <input type="number" id="budget" required>
                <span class="error-msg"></span>
            </div>
            <div class="form-input">
                <label for="employee">Employee Capacity: *</label>
                <input type="number" id="employee" required>
                <span class="error-msg"></span>
            </div>

            <div class="form-btn">
                <button type="submit" class="form-add disabled ">Add</button>
                <button class="form-cancel">Cancel</button>
            </div>
        </form>
        <section class="project-container">
            <h1 class="project__title">Projects</h1>
            <div class="btns">
                <button class="btn btn__add">+Add Project</button>
                <button class="btn btn__seed">Seed Data</button>
            </div>
        </section>
        <section class="table-container">
            <table class="table">
                <thead class="table-header">
                    <tr>
                        <th>Company Name</th>
                        <th>Project Name</th>
                        <th>Budget</th>
                        <th>Employee Capacity</th>
                        <th>Employees</th>
                        <th>Estimated Income</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody class="table-body" id="project-list"></tbody>
            </table>

            <div class="total">
                Total Estimated Income: <span class="income-val">$0.00</span>
            </div>
        </section>
    </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
